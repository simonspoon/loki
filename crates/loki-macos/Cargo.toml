[package]
name = "loki-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "macOS implementation of Loki desktop automation"

[dependencies]
loki-core = { path = "../loki-core" }
core-foundation = "0.10"
# `highsierra` gates CGEventCreateScrollWheelEvent2 (`CGEvent::new_scroll_event`);
# core-graphics feature flags do not cascade, so both must be listed.
core-graphics = { version = "0.25", features = ["elcapitan", "highsierra"] }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
